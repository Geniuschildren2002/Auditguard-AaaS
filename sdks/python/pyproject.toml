[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditguard"
version = "0.1.0"
description = "Python client for AuditGuard prompt security API"
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0"]

[tool.setuptools.packages.find]
where = ["."]
